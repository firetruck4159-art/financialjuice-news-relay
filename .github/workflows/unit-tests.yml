name: Unit tests (no network)

on:
  push:
    paths:
      - '.github/workflows/unit-tests.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
