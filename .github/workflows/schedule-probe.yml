name: Schedule trigger probe

# Temporary scheduler diagnostic; does not collect or modify news.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger event
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "repository=$GITHUB_REPOSITORY"
